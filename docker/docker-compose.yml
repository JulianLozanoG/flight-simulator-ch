services:
  postgres:
    image: postgres:16
    container_name: flight-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: flight_simulator
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: test1
    ports:
      - "5432:5432"
    volumes:
      - flight_pg_data:/var/lib/postgresql/data

volumes:
  flight_pg_data: